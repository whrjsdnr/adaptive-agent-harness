[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptive-agent-harness"
version = "0.1.0.dev0"
description = "Adaptive incubation platform for container harnesses around existing agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13.5,<3", "packaging>=24.2,<27"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.7,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
    "docker: requires a verified Docker CLI, daemon, and container permissions",
    "acceptance: validates an implemented end-to-end acceptance scenario",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [".agents", ".aws", ".codex", "artifacts", ".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
